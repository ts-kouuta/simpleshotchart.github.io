<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleShotChart - バスケットボールシュート記録アプリ</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #FF9933;
            --text-primary: #1a1a1a;
            --text-secondary: #666;
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --border: #e9ecef;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background: var(--bg-secondary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            text-align: center;
            max-width: 400px;
        }

        .icon {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .links a {
            display: block;
            padding: 14px 20px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 15px;
            transition: border-color 0.2s;
        }

        .links a:hover {
            border-color: var(--accent);
        }

        .app-store-badge {
            height: 48px;
            transition: opacity 0.2s;
        }

        .app-store-badge:hover {
            opacity: 0.8;
        }

        .social {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
        }

        .social a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            transition: border-color 0.2s, color 0.2s;
        }

        .social a:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .social svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .copyright {
            margin-top: 40px;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/icon.png" alt="SimpleShotChart" class="icon">
        <h1>SimpleShotChart</h1>
        <p class="tagline">バスケットボールシュート記録アプリ</p>

</body>
